# Security headers for every response of the landing site.
#
# nginx only inherits add_header from the server level into locations that set
# no add_header of their own, so nginx.conf includes this file in each such
# location instead of relying on inheritance. Copied to /etc/nginx/ by the
# Dockerfile (outside conf.d/, so it is not loaded as a server config).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
