# Landing site: static, prerendered pages (see scripts/prerender.mjs).
#
#   /              -> index.html        (Uzbek, x-default)
#   /privacy       -> privacy.html
#   /ru/           -> ru/index.html     (likewise /en/ and /uz-cyrl/)
#   /ru/privacy    -> ru/privacy.html
#   anything else  -> the language's 404.html with a real 404 status
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers, so redirects keep the public scheme/host/port
    # when this container sits behind the edge proxy.
    absolute_redirect off;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    # HTML pages. no-cache: browsers revalidate, so a deploy shows up at once.
    location / {
        try_files $uri $uri.html $uri/ =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Pages are reachable only at their clean URLs (/privacy, /ru/), never as
    # /privacy.html, so each page has exactly one address. Internal redirects
    # (index, error_page) still land here. Regex locations match in order, so
    # this one must stay first.
    location ~ \.html$ {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/(ru|en|uz-cyrl)$ {
        return 301 /$1/;
    }

    # Unknown paths under a language prefix get that language's 404 page.
    location ~ ^/(?<lang>ru|en|uz-cyrl)/ {
        error_page 404 /$lang/404.html;
        try_files $uri $uri.html $uri/ =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's content-hashed bundles: cache forever.
    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Files whose name never changes but whose content can: short cache.
    location ~ ^/(?:favicon\.svg|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Other un-hashed public files (og-image.png, icons).
    location ~* \.(?:png|jpe?g|gif|webp|ico|svg|woff2?)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
