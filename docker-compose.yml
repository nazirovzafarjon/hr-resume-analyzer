x-celery-worker-healthcheck: &celery-worker-healthcheck
  interval: 30s
  timeout: 20s
  retries: 3
  start_period: 30s

services:
  # Persistent Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: resume-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-resume_analyzer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Message Broker with AOF persistence
  redis:
    image: redis:7-alpine
    container_name: resume-analyzer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI Web API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Backend settings from backend/.env (OAuth, email, AI, ...). The image
    # never contains .env (.dockerignore), so without this those values are
    # empty in the container. Keys under `environment:` below win, which
    # keeps the container-network URLs (postgres, redis, /app/uploads).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - AI_CREDENTIAL_ENCRYPTION_KEY=${AI_CREDENTIAL_ENCRYPTION_KEY:-}
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Celery Worker: AI Single Analysis
  worker-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-worker-ai
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - AI_CREDENTIAL_ENCRYPTION_KEY=${AI_CREDENTIAL_ENCRYPTION_KEY:-}
    volumes:
      - uploads-data:/app/uploads
    # Override the Dockerfile HEALTHCHECK (API on :8000): ping this Celery node
    healthcheck:
      <<: *celery-worker-healthcheck
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d worker_ai@$$HOSTNAME --timeout 10"]
    command: ["celery", "-A", "app.core.celery_app", "worker", "-Q", "ai_analysis", "-c", "2", "-l", "info", "-n", "worker_ai@%h", "--max-tasks-per-child=100", "--max-memory-per-child=250000"]

  # Celery Worker: Batch Resume Analysis
  worker-batch:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-worker-batch
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - AI_CREDENTIAL_ENCRYPTION_KEY=${AI_CREDENTIAL_ENCRYPTION_KEY:-}
    volumes:
      - uploads-data:/app/uploads
    # Override the Dockerfile HEALTHCHECK (API on :8000): ping this Celery node
    healthcheck:
      <<: *celery-worker-healthcheck
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d worker_batch@$$HOSTNAME --timeout 10"]
    command: ["celery", "-A", "app.core.celery_app", "worker", "-Q", "batch_analysis", "-c", "4", "-l", "info", "-n", "worker_batch@%h", "--max-tasks-per-child=100", "--max-memory-per-child=250000"]

  # Celery Worker: Notifications (Resend Email)
  worker-notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-worker-notifications
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    # Override the Dockerfile HEALTHCHECK (API on :8000): ping this Celery node
    healthcheck:
      <<: *celery-worker-healthcheck
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d worker_notifications@$$HOSTNAME --timeout 10"]
    command: ["celery", "-A", "app.core.celery_app", "worker", "-Q", "notifications", "-c", "2", "-l", "info", "-n", "worker_notifications@%h", "--max-tasks-per-child=100", "--max-memory-per-child=250000"]

  # Celery Worker: File Exports (PDF, Excel, Word)
  worker-exports:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-worker-exports
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - uploads-data:/app/uploads
    # Override the Dockerfile HEALTHCHECK (API on :8000): ping this Celery node
    healthcheck:
      <<: *celery-worker-healthcheck
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d worker_exports@$$HOSTNAME --timeout 10"]
    command: ["celery", "-A", "app.core.celery_app", "worker", "-Q", "exports", "-c", "2", "-l", "info", "-n", "worker_exports@%h", "--max-tasks-per-child=100", "--max-memory-per-child=250000"]

  # Celery Worker: Default Queue
  worker-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-worker-default
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - uploads-data:/app/uploads
    # Override the Dockerfile HEALTHCHECK (API on :8000): ping this Celery node
    healthcheck:
      <<: *celery-worker-healthcheck
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d worker_default@$$HOSTNAME --timeout 10"]
    command: ["celery", "-A", "app.core.celery_app", "worker", "-Q", "default", "-c", "1", "-l", "info", "-n", "worker_default@%h", "--max-tasks-per-child=100", "--max-memory-per-child=250000"]

  # Celery Beat Scheduler (Periodic Cron & Outbox Scanner)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-celery-beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    # Beat has no ping endpoint. It saves its schedule file about every 3 minutes,
    # so a stale file means the scheduler is stuck.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/app/celerybeat-schedule') < 600 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "info"]

  # Telegram bot (long polling). Opt-in: `docker compose --profile telegram up -d`
  # after setting TELEGRAM_ENABLED, TELEGRAM_BOT_TOKEN and TELEGRAM_BOT_USERNAME
  # in backend/.env. Exits with an error while the bot is not configured.
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-bot
    profiles: ["telegram"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    # Override the Dockerfile HEALTHCHECK (API on :8000): the bot serves no HTTP.
    healthcheck:
      disable: true
    command: ["python", "-m", "app.bot"]

  # Flower Dashboard: Real-time Celery Task Monitoring
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-flower
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    # Override the Dockerfile HEALTHCHECK, which probes the API on :8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["celery", "-A", "app.core.celery_app", "flower", "--port=5555"]

volumes:
  postgres-data:
  redis-data:
  uploads-data:
