# Edge proxy for public test access through ngrok (docker-compose.public.yml).
#
# ngrok terminates HTTPS on the account's dev domain and forwards plain HTTP
# here, so everything is served from ONE public origin (the free ngrok plan
# has a single domain):
#
#   /api/              -> api:8000   (FastAPI)
#   /uploads/profile/  -> api:8000   (public avatars)
#   /                  -> crm:80     (CRM single-page app)
#
# Same origin means the CRM calls the API at the relative /api path, so no
# CORS setup is needed for testers. The Telegram bot needs no route here: it
# long-polls Telegram, so it only has to link to this public origin.

upstream backend_api {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream frontend_crm {
    server crm:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ngrok sends X-Forwarded-Proto: https; keep it so the backend sees the real
# scheme. Direct local requests (http://localhost:8090) fall back to http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # No security headers here: the CRM container already sends them, and
    # adding them again would duplicate every header.

    # Candidate resumes (PDF, DOCX) and profile images.
    client_max_body_size 25M;
    client_body_buffer_size 1M;

    # Long enough for AI analysis and document exports.
    proxy_connect_timeout 60s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        proxy_pass http://backend_api;
    }

    location /uploads/profile/ {
        proxy_pass http://backend_api;
    }

    location / {
        proxy_pass http://frontend_crm;
    }
}
