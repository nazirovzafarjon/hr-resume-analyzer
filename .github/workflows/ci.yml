name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so a new push never queues
# behind a stale (possibly hung) run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Lint, Unit & Celery Integration Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_analyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-timeout

      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check .

      - name: Run Backend Unit & API Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_analyzer_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_analyzer_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
        run: |
          cd backend
          python -m pytest tests -m "not integration" -q --timeout=120 --durations=15

      - name: Run Celery & Redis Integration Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_analyzer_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_analyzer_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
        run: |
          cd backend
          python -m pytest tests/integration -v --timeout=300

  crm-ci:
    name: CRM Frontend CI (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'crm/package-lock.json'

      - name: Install CRM dependencies
        run: |
          cd crm
          npm ci

      - name: Run ESLint
        run: |
          cd crm
          npm run lint

      - name: Run TypeScript typecheck
        run: |
          cd crm
          npm run typecheck

      - name: Run Vitest unit tests
        run: |
          cd crm
          npm run test

      - name: Build CRM production bundle
        run: |
          cd crm
          npm run build

  landing-ci:
    name: Landing Frontend CI (Typecheck & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'landing/package-lock.json'

      - name: Install Landing dependencies
        run: |
          cd landing
          npm ci

      - name: Run TypeScript typecheck
        run: |
          cd landing
          npm run typecheck

      - name: Build Landing production bundle
        run: |
          cd landing
          npm run build
